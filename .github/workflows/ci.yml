name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          # dart format output can change between stable SDK releases. Keep the
          # repository's canonical formatter reproducible; the test matrix
          # below still tracks the moving stable channel for compatibility.
          sdk: '3.13.0'

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

  latest-analyzer:
    name: Latest allowed analyzer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.13.0'

      - name: Resolve without the repository lock
        run: |
          rm pubspec.lock
          dart pub get

      - name: Analyze package sources
        run: dart analyze lib --fatal-infos

      - name: Run parser compatibility tests
        run: >-
          dart test --reporter expanded
          test/core/project_language_version_test.dart
          test/core/project_context_test.dart
          test/core/project_source_path_test.dart
          test/adapters/get_it/generated_wiring_probe_test.dart

      - name: Smoke init and scan
        run: |
          repro="$RUNNER_TEMP/final-parameter-language-version"
          cp -R test/fixtures/final_parameter_language_version "$repro"
          dart pub get --directory "$repro"
          dart run bin/flutter_pruner.dart init \
            --project "$repro" --type application --entrypoint lib/main.dart \
            --platform linux --yes
          dart run bin/flutter_pruner.dart scan \
            --project "$repro" --adapter dart --format json \
            --output latest-analyzer-scan.json
          jq -e \
            '.statistics.findings.byTier.SAFE == 0 and .statistics.findings.byTier.HIGH == 0' \
            "$repro/.flutter_pruner/reports/latest-analyzer-scan.json"

  test:
    name: Test (${{ matrix.os }}, Dart ${{ matrix.sdk }})
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # package:analyzer ships frequent breaking changes and is pinned to the
        # SDK, so keep the declared SDK floor on Linux alongside current stable.
        # Run the full suite on every supported runner. This includes the
        # mutation-safety paths (operation locking, verifier termination,
        # quarantine/rollback, and import cleanup) rather than treating their
        # platform branches as untested implementation detail.
        include:
          - os: ubuntu-latest
            sdk: '3.9'
          - os: ubuntu-latest
            sdk: stable
          - os: macos-latest
            sdk: stable
          - os: windows-latest
            sdk: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Install dependencies
        run: dart pub get

      - name: Run tests
        run: dart test --reporter expanded

  dependency-bounds:
    name: Dependency lower bounds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.9'

      - name: Resolve declared lower bounds
        run: dart pub downgrade

      - name: Analyze lower bounds
        run: dart analyze --fatal-infos

  package:
    name: Package dry run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # This performs pub's package-content and publishability validation
      # without uploading anything. It catches accidental internal artifacts
      # and a broken published package surface before a release tag exists.
      - name: Validate publishable package
        run: dart pub publish --dry-run

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - run: dart pub get

      # The CLI must stay runnable at every commit. A tool that cannot start is
      # worse than one with a missing feature.
      - name: Version
        run: dart run bin/flutter_pruner.dart --version

      - name: Help
        run: dart run bin/flutter_pruner.dart --help

      - name: Scan self
        run: dart run bin/flutter_pruner.dart scan --adapter dart --format json --output self-scan.json

      - name: Reject self-scan SAFE/HIGH false positives
        run: >-
          jq -e
          '.statistics.findings.byTier.SAFE == 0 and
          .statistics.findings.byTier.HIGH == 0'
          .flutter_pruner/reports/self-scan.json
