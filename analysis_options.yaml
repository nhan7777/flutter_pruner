include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat these as errors — they matter for a tool that deletes files.
    unused_import: error
    unused_local_variable: error
    dead_code: error
    invalid_use_of_visible_for_testing_member: error

  exclude:
    - test/fixtures/**   # Fixture projects are intentionally messy.
    - doc/**             # adapter-template.dart is a copy-me starting point.
    - "**/*.g.dart"

linter:
  rules:
    # Correctness
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    comment_references: true
    only_throw_errors: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # Style — keep the codebase uniform so contributors can pattern-match.
    directives_ordering: true
    prefer_final_locals: true
    prefer_relative_imports: true
    prefer_single_quotes: true
    sort_pub_dependencies: true
    unawaited_futures: true

    # Documentation — public API must be documented for contributors.
    public_member_api_docs: true
    slash_for_doc_comments: true
